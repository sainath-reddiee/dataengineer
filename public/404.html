<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <meta name="description" content="The page you are looking for does not exist. Browse our data engineering articles and tutorials." />
    <meta name="robots" content="noindex, follow" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #F6F2EB 0%, #FCF4EF 50%, #FCF4EF 100%);
        color: #1B1A17;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .error-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
      }
      .error-code {
        font-size: 6rem;
        font-weight: 800;
        background: linear-gradient(135deg, #B4441F 0%, #B4441F 50%, #B4441F 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #2F2C27;
        margin-bottom: 1rem;
      }
      p {
        color: #5E584F;
        font-size: 1.1rem;
        margin-bottom: 2rem;
        line-height: 1.7;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .links a {
        display: inline-block;
        padding: 12px 24px;
        background: rgba(27, 26, 23, 0.08);
        color: #9C3A1A;
        text-decoration: none;
        border-radius: 8px;
        border: 1px solid rgba(27, 26, 23, 0.1);
        font-weight: 500;
        transition: background 0.2s, border-color 0.2s;
      }
      .links a:hover {
        background: rgba(27, 26, 23, 0.12);
        border-color: rgba(180, 68, 31, 0.4);
      }
      .links a.primary {
        background: linear-gradient(135deg, #E2A487, #E2A487);
        color: white;
        border: none;
      }
      .links a.primary:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>
        The page you are looking for does not exist or has been moved.
        Try browsing our articles instead.
      </p>
      <div class="links">
        <a href="/" class="primary">Go to Homepage</a>
        <a href="/articles">All Articles</a>
        <a href="/about">About</a>
      </div>
    </div>
  </body>
</html>
