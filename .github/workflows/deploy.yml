name: Build and Deploy to Hostinger (Incremental)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'functions.php'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        default: 'incremental'
        options:
          - 'incremental'
          - 'force-rebuild'
          - 'full-with-categories'
          - 'posts-only'
          - 'nuclear-redeploy'
      skip_cache:
        description: 'Skip build cache?'
        required: false
        type: boolean
        default: false
      skip_deploy:
        description: 'Build only (skip deployment)?'
        required: false
        type: boolean
        default: false
      verify_build:
        description: 'Run build verification?'
        required: false
        type: boolean
        default: true
      notify_search_engines:
        description: 'Notify search engines?'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (test without actual deployment)?'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 21 * * *'
  repository_dispatch:
    types: [post-published]

# Hostinger HiddenStores writes each upload to `.in.<filename>.` then renames it.
# Overlapping FTP deploys (or a cancelled upload) leave those files behind and the
# next run fails with: "Temporary hidden file ... already exists".
# Queue deploys instead of cancelling — cancelling mid-upload creates more leftovers.
concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A full/forced re-upload (force-rebuild, full-with-categories, posts-only,
    # and especially nuclear-redeploy's delete-everything-then-reupload) has to
    # push every folder in dist/ (100+ articles, 50+ glossary terms, 30+
    # compare pages, tags, cheat sheets, JS/CSS assets...) over plain FTP,
    # one MKD/STOR round trip at a time. That routinely runs well past 25
    # minutes and a mid-transfer job timeout leaves Hostinger in whatever
    # half-deleted/half-uploaded state the clean-slate wipe was in when it was
    # killed (this happened on 2026-09-06: nuclear-redeploy was cancelled at
    # 25m mid-glossary-upload and the live site 403'd with sitemap.xml/tags
    # missing until a follow-up full redeploy completed). Automated triggers
    # (push/schedule/repository_dispatch) stay at the tighter 25m budget since
    # those are small incremental diffs and should fail fast if something
    # hangs; manual full-rebuild dispatches get much more headroom to finish.
    timeout-minutes: ${{ (github.event.inputs.build_type == 'nuclear-redeploy' || github.event.inputs.build_type == 'force-rebuild' || github.event.inputs.build_type == 'full-with-categories' || github.event.inputs.build_type == 'posts-only') && 120 || 25 }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 🔍 Detect Changes & Configure Build
        id: changes
        run: |
          echo "trigger=${{ github.event_name }}" >> $GITHUB_OUTPUT

          # ── WordPress auto-deploy: log which article triggered this run ──
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            WP_SLUG="${{ github.event.client_payload.slug }}"
            WP_TITLE="${{ github.event.client_payload.title }}"
            WP_ACTION="${{ github.event.client_payload.action }}"
            WP_POST_ID="${{ github.event.client_payload.post_id }}"
            echo "wp_slug=$WP_SLUG"     >> $GITHUB_OUTPUT
            echo "wp_title=$WP_TITLE"   >> $GITHUB_OUTPUT
            echo "wp_action=$WP_ACTION" >> $GITHUB_OUTPUT
            echo ""
            echo "📝 WordPress triggered this deploy:"
            echo "   Post ID : $WP_POST_ID"
            echo "   Slug    : $WP_SLUG"
            echo "   Title   : $WP_TITLE"
            echo "   Action  : $WP_ACTION"
            echo "   URL     : https://dataengineerhub.blog/articles/$WP_SLUG"
            echo ""
            # Surface in the Actions job summary
            echo "### 📝 WordPress Auto-Deploy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Action | \`$WP_ACTION\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Slug | \`$WP_SLUG\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Title | $WP_TITLE |" >> $GITHUB_STEP_SUMMARY
            echo "| Live URL | https://dataengineerhub.blog/articles/$WP_SLUG |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # WordPress publish is content-only. Do not treat the last two
          # commits on main as "code changed" — that forced a full Vite
          # rebuild + FTP of every article (~13 minutes per update).
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "📄 WordPress publish — skip Vite, incremental pages only"
          elif git diff --name-only HEAD^ HEAD | grep -qE '^(src/|scripts/|public/|index.html|vite.config.js|tailwind.config.js|package)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Code changes detected - full rebuild needed"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "📄 Only content/config changed"
          fi
          
          # Configure build based on trigger type and inputs
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            SKIP_CACHE="${{ github.event.inputs.skip_cache }}"
            SKIP_DEPLOY="${{ github.event.inputs.skip_deploy }}"
            VERIFY_BUILD="${{ github.event.inputs.verify_build }}"
            NOTIFY_SE="${{ github.event.inputs.notify_search_engines }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            
            echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
            echo "skip_cache=$SKIP_CACHE" >> $GITHUB_OUTPUT
            echo "skip_deploy=$SKIP_DEPLOY" >> $GITHUB_OUTPUT
            echo "verify_build=$VERIFY_BUILD" >> $GITHUB_OUTPUT
            echo "notify_search_engines=$NOTIFY_SE" >> $GITHUB_OUTPUT
            echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
            
            # Set dangerous clean slate flag for nuclear option
            if [ "$BUILD_TYPE" == "nuclear-redeploy" ]; then
              echo "use_clean_slate=true" >> $GITHUB_OUTPUT
              echo "☢️  NUCLEAR REDEPLOY MODE ENABLED"
            else
              echo "use_clean_slate=false" >> $GITHUB_OUTPUT
            fi
            
            echo "🎮 Manual trigger with options:"
            echo "  - Build Type: $BUILD_TYPE"
            echo "  - Skip Cache: $SKIP_CACHE"
            echo "  - Skip Deploy: $SKIP_DEPLOY"
            echo "  - Verify Build: $VERIFY_BUILD"
            echo "  - Notify Search Engines: $NOTIFY_SE"
            echo "  - Dry Run: $DRY_RUN"
          else
            # Default behavior for automated triggers
            echo "build_type=incremental" >> $GITHUB_OUTPUT
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
            echo "verify_build=true" >> $GITHUB_OUTPUT
            echo "notify_search_engines=true" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "use_clean_slate=false" >> $GITHUB_OUTPUT
          fi
          
          # Determine build flags
          case "${{ github.event.inputs.build_type }}" in
            "force-rebuild"|"nuclear-redeploy")
              echo "build_flags=--force" >> $GITHUB_OUTPUT
              echo "🔨 Force rebuild all pages"
              ;;
            "full-with-categories")
              echo "build_flags=--force" >> $GITHUB_OUTPUT
              echo "📚 Full rebuild including categories/tags"
              ;;
            "posts-only")
              # A posts-only deploy can leave /articles, homepage discovery,
              # glossary, comparisons, and cheat sheets stale. Keep the input
              # for backwards compatibility, but perform a safe full rebuild.
              echo "build_flags=--force" >> $GITHUB_OUTPUT
              echo "🛡️ Posts-only requested; running a full forced rebuild to protect crawler HTML"
              ;;
            *)
              echo "build_flags=" >> $GITHUB_OUTPUT
              echo "📚 Full build (including categories/tags/articles listing)"
              ;;
          esac

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            WP_SLUG_FLAG="${{ github.event.client_payload.slug }}"
            if [ -n "$WP_SLUG_FLAG" ]; then
              echo "build_flags=--slug=$WP_SLUG_FLAG" >> $GITHUB_OUTPUT
              echo "⚡ Incremental publish for /$WP_SLUG_FLAG"
            fi
          fi

      - name: 💾 Restore Build Cache
        id: cache-restore
        if: steps.changes.outputs.skip_cache != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.npm
            dist
            public/sitemap.xml
            public/indexnow-key.txt
            .build-cache.json
          key: build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'postcss.config.js') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'postcss.config.js') }}-
            build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 💾 Restore FTP Sync State
        id: ftp-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-state-${{ github.run_id }}
          restore-keys: |
            ftp-state-

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🗺️ Generate & Validate Sitemap
        run: |
          npm run sitemap:generate
          npm run sitemap:validate
          npm run rss-feed || echo "⚠️ RSS generation skipped"
          if [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            npm run llm-sitemap || echo "⚠️ LLM sitemap generation skipped"
            npm run llms-full || echo "⚠️ llms-full generation skipped"
          else
            echo "⚡ Skipping llms-full / llm-sitemap on WordPress publish"
          fi

      - name: 🏗️ Build Application (Vite)
        if: github.event_name != 'repository_dispatch' || steps.changes.outputs.code_changed == 'true'
        run: npm run build:vite
        env:
          NODE_ENV: production
          VITE_ADS_ENABLED: ${{ secrets.VITE_ADS_ENABLED }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_ADMIN_USER_HASH: ${{ secrets.VITE_ADMIN_USER_HASH }}
          VITE_ADMIN_PASS_HASH: ${{ secrets.VITE_ADMIN_PASS_HASH }}
          VITE_GISCUS_REPO: ${{ secrets.VITE_GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ secrets.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ secrets.VITE_GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.VITE_GISCUS_CATEGORY_ID }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_GSC_CLIENT_ID: ${{ secrets.VITE_GSC_CLIENT_ID }}
          VITE_WP_APP_PASSWORD: ${{ secrets.VITE_WP_APP_PASSWORD }}

      - name: 🛟 Ensure dist exists after a content-only publish
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -f dist/index.html ]; then
            echo "✅ Restored dist/index.html — skipping Vite"
            exit 0
          fi
          echo "⚠️ dist/ missing from cache — running Vite once"
          npm run build:vite
        env:
          NODE_ENV: production
          VITE_ADS_ENABLED: ${{ secrets.VITE_ADS_ENABLED }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_ADMIN_USER_HASH: ${{ secrets.VITE_ADMIN_USER_HASH }}
          VITE_ADMIN_PASS_HASH: ${{ secrets.VITE_ADMIN_PASS_HASH }}
          VITE_GISCUS_REPO: ${{ secrets.VITE_GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ secrets.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ secrets.VITE_GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.VITE_GISCUS_CATEGORY_ID }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_GSC_CLIENT_ID: ${{ secrets.VITE_GSC_CLIENT_ID }}
          VITE_WP_APP_PASSWORD: ${{ secrets.VITE_WP_APP_PASSWORD }}

      - name: 🗑️ Delete Build Cache (Force Fresh Build)
        if: |
          steps.changes.outputs.build_type == 'force-rebuild' || 
          steps.changes.outputs.build_type == 'nuclear-redeploy'
        run: |
          rm -f .build-cache.json
          echo "🗑️ Build cache deleted - all pages will be regenerated with unique timestamps"
          echo "✅ This ensures FTP will detect file changes and upload them"

      - name: 📄 Generate Static Pages
        id: static_pages
        env:
          NODE_ENV: production
          VITE_ADS_ENABLED: ${{ secrets.VITE_ADS_ENABLED }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          # Get build flags from previous step
          BUILD_FLAGS="${{ steps.changes.outputs.build_flags }}"
          
          echo "🚀 Running build with flags: $BUILD_FLAGS"
          node scripts/generateStaticPagesIncremental.js $BUILD_FLAGS
          
          # ⚠️ CRITICAL: Verify articles exist before deploying
          echo ""
          echo "🔍 Verifying article pages in dist/..."
          
          if [ ! -d "dist/articles" ]; then
            echo "❌ ERROR: dist/articles directory not found!"
            echo "🔨 Forcing complete rebuild of all pages..."
            node scripts/generateStaticPagesIncremental.js --force
          fi
          
          # Count per-article directories, not the listing page at dist/articles/index.html
          ARTICLE_COUNT=$(find dist/articles -mindepth 2 -name 'index.html' 2>/dev/null | wc -l | tr -d ' ' || echo "0")
          echo "📊 Found $ARTICLE_COUNT article pages in dist/"
          
          if [ "$ARTICLE_COUNT" -lt 50 ]; then
            echo "❌ CRITICAL: No articles found in dist/articles!"
            echo "This would cause the FTP sync to delete all articles from the server."
            echo ""
            echo "Attempting one final forced rebuild..."
            node scripts/generateStaticPagesIncremental.js --force
            
            # Re-check after force rebuild
            ARTICLE_COUNT=$(find dist/articles -mindepth 2 -name 'index.html' 2>/dev/null | wc -l | tr -d ' ' || echo "0")
            
            if [ "$ARTICLE_COUNT" -lt 50 ]; then
              echo "❌ FATAL: Still no articles after forced rebuild!"
              echo "Deployment aborted to prevent data loss."
              exit 1
            fi
          fi

          # The listing is the main crawler entry point. A missing file falls
          # through to the homepage shell and creates a duplicate canonical.
          if [ ! -f "dist/articles/index.html" ]; then
            echo "❌ FATAL: dist/articles/index.html is missing"
            exit 1
          fi
          if ! grep -q 'rel="canonical" href="https://dataengineerhub.blog/articles"' dist/articles/index.html; then
            echo "❌ FATAL: /articles has the wrong canonical"
            exit 1
          fi
          ARTICLE_LINK_COUNT=$(grep -o 'href="https://dataengineerhub.blog/articles/[^"]*"' dist/articles/index.html | sort -u | wc -l | tr -d ' ')
          if [ "$ARTICLE_LINK_COUNT" -lt 50 ]; then
            echo "❌ FATAL: /articles contains only $ARTICLE_LINK_COUNT article links"
            exit 1
          fi
          echo "✅ /articles listing has the correct canonical and $ARTICLE_LINK_COUNT article links"
          
          echo "✅ Deployment ready with $ARTICLE_COUNT article pages"
          
          # Verify essential pages were generated
          ESSENTIAL_COUNT=0
          for PAGE in about contact privacy-policy terms-of-service disclaimer; do
            if [ -f "dist/${PAGE}/index.html" ]; then
              ESSENTIAL_COUNT=$((ESSENTIAL_COUNT + 1))
              echo "  ✅ dist/${PAGE}/index.html exists"
            else
              echo "  ⚠️ dist/${PAGE}/index.html MISSING"
            fi
          done
          echo "📊 Found $ESSENTIAL_COUNT/5 essential pages in dist/"
          
          # Generate FAQ schemas for articles
          echo ""
          echo "📋 Generating FAQ schemas..."
          npm run faq-schema || echo "⚠️ FAQ schema generation skipped"
          
          echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          echo "build_completed=true" >> $GITHUB_OUTPUT
          
          # Add to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Static Pages Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Articles:** $ARTICLE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ steps.changes.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Flags:** \`$BUILD_FLAGS\`" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$BUILD_FLAGS" == *"--posts-only"* ]]; then
            echo "- ℹ️  **Note:** Categories and tags are handled dynamically by React" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🗺️ Drop noindex URLs from sitemap
        run: node scripts/pruneSitemapNoindex.js

      - name: 🔍 Verify Build (Optional)
        if: steps.changes.outputs.verify_build == 'true'
        run: |
          echo "🔍 Running build verification..."
          npm run build:verify

      - name: ℹ️ Build Status
        run: |
          echo "## 📊 Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Manual Options:**" >> $GITHUB_STEP_SUMMARY
            echo "- Build Type: ${{ steps.changes.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
            echo "- Skip Cache: ${{ steps.changes.outputs.skip_cache }}" >> $GITHUB_STEP_SUMMARY
            echo "- Skip Deploy: ${{ steps.changes.outputs.skip_deploy }}" >> $GITHUB_STEP_SUMMARY
            echo "- Verify Build: ${{ steps.changes.outputs.verify_build }}" >> $GITHUB_STEP_SUMMARY
            echo "- Dry Run: ${{ steps.changes.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ] && [ "${{ steps.changes.outputs.skip_cache }}" != "true" ]; then
            if [ "${{ steps.changes.outputs.code_changed }}" == "true" ]; then
              echo "🔨 Code changed - full rebuild performed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚡ Using cached build + incremental pages" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "🆕 Fresh build completed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show what triggered this build
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 WordPress Content Update" >> $GITHUB_STEP_SUMMARY
            echo "Triggered by: Post published/updated in WordPress" >> $GITHUB_STEP_SUMMARY
            echo "Only changed pages were regenerated!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔑 Generate IndexNow Key
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          
          const publicDir = path.join(process.cwd(), 'public');
          const keyFile = path.join(publicDir, 'indexnow-key.txt');
          
          if (!fs.existsSync(publicDir)) {
            fs.mkdirSync(publicDir, { recursive: true });
          }
          
          if (fs.existsSync(keyFile)) {
            const key = fs.readFileSync(keyFile, 'utf8').trim();
            console.log('✅ Using existing key:', key);
          } else {
            const key = crypto.randomBytes(16).toString('hex');
            fs.writeFileSync(keyFile, key, 'utf8');
            const verificationFile = path.join(publicDir, \`\${key}.txt\`);
            fs.writeFileSync(verificationFile, key, 'utf8');
            console.log('🔑 Generated new key:', key);
          }
          "

      - name: 📋 Prepare Files
        run: |
          mkdir -p dist
          
          [ -f "public/sitemap.xml" ] && cp public/sitemap.xml dist/ && echo "✅ Copied sitemap.xml"
          [ -f "public/sitemap-index.xml" ] && cp public/sitemap-index.xml dist/ && echo "✅ Copied sitemap-index.xml"
          [ -f "public/robots.txt" ] && cp public/robots.txt dist/ && echo "✅ Copied robots.txt"
          [ -f "public/.htaccess" ] && cp public/.htaccess dist/ && echo "✅ Copied .htaccess"
          
          find public -name "*.txt" -exec cp {} dist/ \; 2>/dev/null && echo "✅ Copied .txt files" || echo "⚠️ No .txt files found"
          
          # Clean up stale files that should no longer be deployed
          [ -f "dist/sitemap-pseo-1.xml" ] && rm dist/sitemap-pseo-1.xml && echo "🗑️ Removed stale sitemap-pseo-1.xml from dist"
          
          echo "✅ Files prepared for deployment"

      - name: 🗑️ Clear FTP Sync State (Force Upload All Files)
        if: |
          steps.changes.outputs.build_type == 'force-rebuild' || 
          steps.changes.outputs.build_type == 'nuclear-redeploy'
        run: |
          echo "🗑️ Removing FTP sync state to force re-upload of all files..."
          rm -f .ftp-deploy-sync-state.json
          echo "✅ FTP sync state cleared - ALL files will be uploaded"
          echo ""
          echo "This ensures that even if file timestamps are the same,"
          echo "the FTP tool will re-upload everything because it has no"
          echo "previous state to compare against."
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Force Upload Enabled" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ FTP sync state cleared - all files will be re-uploaded regardless of changes" >> $GITHUB_STEP_SUMMARY
          echo "📝 Each HTML file contains unique build timestamp to ensure file content differs" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Copy FTP Sync State to dist/
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        run: |
          if [ -f ".ftp-deploy-sync-state.json" ]; then
            cp .ftp-deploy-sync-state.json dist/
            echo "✅ FTP sync state copied to dist/"
          else
            echo "ℹ️ No FTP sync state found in root"
          fi

      - name: 🧹 Remove leftover Hostinger FTP temp files
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: '21'
          FTP_SERVER_DIR: /public_html
          DIST_DIR: dist
          CLEANUP_TIMEOUT_SEC: '90'
        run: python3 scripts/cleanupFtpTempFiles.py
        continue-on-error: true

      - name: 🚀 Deploy to Hostinger (FTPS)
        id: ftp_deploy
        if: steps.changes.outputs.skip_deploy != 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: ${{ steps.changes.outputs.use_clean_slate == 'true' }}
          state-name: .ftp-deploy-sync-state.json
          dry-run: ${{ steps.changes.outputs.dry_run == 'true' }}
          timeout: 300000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.DS_Store
            **/Thumbs.db
            **/.build-cache.json
            **/*.map
            **/.in.*

      - name: 🧹 Clear leftover temps after failed FTP attempt
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true' && steps.ftp_deploy.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: '21'
          FTP_SERVER_DIR: /public_html
          DIST_DIR: dist
          CLEANUP_TIMEOUT_SEC: '90'
        run: |
          echo "FTP deploy failed — clearing leftover Hostinger .in.* files, then retrying"
          python3 scripts/cleanupFtpTempFiles.py
          sleep 20
        continue-on-error: true

      - name: 🚀 Retry Deploy to Hostinger (FTPS)
        id: ftp_deploy_retry
        if: steps.changes.outputs.skip_deploy != 'true' && steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: ${{ steps.changes.outputs.use_clean_slate == 'true' }}
          state-name: .ftp-deploy-sync-state.json
          dry-run: ${{ steps.changes.outputs.dry_run == 'true' }}
          timeout: 300000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.DS_Store
            **/Thumbs.db
            **/.build-cache.json
            **/*.map
            **/.in.*

      - name: 💾 Copy FTP Sync State to Root for Caching
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true' && always()
        run: |
          if [ -f "dist/.ftp-deploy-sync-state.json" ]; then
            cp dist/.ftp-deploy-sync-state.json .ftp-deploy-sync-state.json
            echo "✅ FTP sync state copied back to root for caching"
          else
            echo "⚠️ No FTP sync state found in dist/"
          fi

      - name: ⏭️ Deployment Skipped
        if: steps.changes.outputs.skip_deploy == 'true'
        run: |
          echo "⏭️ Deployment skipped by user request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully but was not deployed." >> $GITHUB_STEP_SUMMARY

      - name: ⏸️ Smart Wait
        if: |
          steps.changes.outputs.skip_deploy != 'true' &&
          steps.changes.outputs.dry_run != 'true' &&
          (steps.ftp_deploy.outcome == 'success' || steps.ftp_deploy_retry.outcome == 'success')
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "⚡ WordPress update - quick wait (5s)"
            sleep 5
          elif [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "⚡ Cache hit - minimal wait (3s)"
            sleep 3
          else
            echo "⏳ Full deploy - waiting 8s for propagation"
            sleep 8
          fi

      - name: 🔍 Deployment Verification
        id: live_verify
        if: |
          steps.changes.outputs.skip_deploy != 'true' &&
          steps.changes.outputs.dry_run != 'true' &&
          (steps.ftp_deploy.outcome == 'success' || steps.ftp_deploy_retry.outcome == 'success')
        run: |
          echo "🔍 Verifying deployment..."
          FAIL=0

          homepage_code=$(curl -sS -o /dev/null -w "%{http_code}" https://dataengineerhub.blog/ || echo "000")
          if [ "$homepage_code" = "200" ]; then
            echo "✅ Main site is accessible (HTTP $homepage_code)"
          else
            echo "❌ Main site check failed (HTTP $homepage_code)"
            FAIL=1
          fi

          sitemap_code=$(curl -sS -o /dev/null -w "%{http_code}" https://dataengineerhub.blog/sitemap.xml || echo "000")
          if [ "$sitemap_code" = "200" ]; then
            echo "✅ Sitemap is accessible (HTTP $sitemap_code)"
          else
            echo "❌ Sitemap not found (HTTP $sitemap_code)"
            FAIL=1
          fi

          # Fail the deployment when /articles is missing or falls through to
          # the homepage/404 shell. Print the status first so a 404 is obvious
          # in the log instead of a silent grep miss + exit 1.
          ARTICLES_CODE=$(curl -sS -o /tmp/live-articles.html -w "%{http_code}" -A "AdsBot-Google (+http://www.google.com/adsbot.html)" https://dataengineerhub.blog/articles || echo "000")
          ARTICLES_HTML=$(cat /tmp/live-articles.html 2>/dev/null || true)
          if [ "$ARTICLES_CODE" != "200" ]; then
            echo "❌ /articles returned HTTP $ARTICLES_CODE (expected 200 static listing)"
            FAIL=1
          elif ! grep -q 'rel="canonical" href="https://dataengineerhub.blog/articles"' /tmp/live-articles.html; then
            echo "❌ /articles is not serving its canonical static listing (HTTP $ARTICLES_CODE)"
            FAIL=1
          else
            LIVE_ARTICLE_LINKS=$(grep -o 'href="https://dataengineerhub.blog/articles/[^"]*"' /tmp/live-articles.html | sort -u | wc -l | tr -d ' ')
            if [ "$LIVE_ARTICLE_LINKS" -lt 50 ]; then
              echo "❌ /articles exposes only $LIVE_ARTICLE_LINKS article links to AdsBot"
              FAIL=1
            elif curl -sI -A "AdsBot-Google (+http://www.google.com/adsbot.html)" https://dataengineerhub.blog/articles | grep -qi '^x-robots-tag:.*noindex'; then
              echo "❌ /articles unexpectedly returns X-Robots-Tag: noindex"
              FAIL=1
            else
              echo "✅ Live /articles crawler HTML is correct (HTTP $ARTICLES_CODE, $LIVE_ARTICLE_LINKS article links)"
            fi
          fi

          # The generator/build verifier prove these pages are noindexed in
          # dist. Glossary/compare term HTML is often served from R2
          # (x-r2-key) with a 24h cache, so a Hostinger-only force-rebuild
          # will not overwrite those objects. Report stale live pSEO without
          # failing the deploy. Use nuclear-redeploy (or purge R2 + CF) when
          # x-r2-key pages still say index,follow. .htaccess X-Robots-Tag
          # only applies when Apache serves the file, not when R2 does.
          for PAGE in glossary/snowflake compare/airflow-vs-prefect category/snowflake cheatsheets/snowflake-interview-questions; do
            PAGE_CODE=$(curl -sS -o /tmp/live-pseo.html -w "%{http_code}" -A "Googlebot" "https://dataengineerhub.blog/${PAGE}" || echo "000")
            PAGE_HEADERS=$(curl -sSI -A "Googlebot" "https://dataengineerhub.blog/${PAGE}" || true)
            if [ "$PAGE_CODE" != "200" ]; then
              echo "::warning::/${PAGE} returned HTTP $PAGE_CODE; static dist was already verified, but production cache/origin needs checking"
            elif ! grep -qi 'meta name="robots" content="noindex, follow"' /tmp/live-pseo.html; then
              if echo "$PAGE_HEADERS" | grep -qi '^x-r2-key:'; then
                echo "::warning::/${PAGE} is still the old R2 object (indexable). Force-rebuild FTP does not replace R2; run nuclear-redeploy and purge Cloudflare."
              else
                echo "::warning::/${PAGE} is still serving cached indexable HTML. The uploaded dist page is noindex; verify Hostinger cache purge/expiry and X-Robots-Tag."
              fi
            else
              echo "✅ /${PAGE} is live and noindexed"
            fi
          done

          robots_code=$(curl -sS -o /dev/null -w "%{http_code}" https://dataengineerhub.blog/robots.txt || echo "000")
          if [ "$robots_code" = "200" ]; then
            echo "✅ Robots.txt is accessible (HTTP $robots_code)"
          else
            echo "⚠️ Robots.txt not found (HTTP $robots_code)"
          fi

          if [ -f "public/indexnow-key.txt" ]; then
            KEY=$(cat public/indexnow-key.txt | tr -d '[:space:]')
            if curl -sf -o /dev/null "https://dataengineerhub.blog/${KEY}.txt"; then
              echo "✅ IndexNow key verification file is accessible"
            else
              echo "⚠️ IndexNow key verification failed"
            fi
          fi

          # Verify essential pages (About, Contact, Privacy, Terms, Disclaimer)
          for PAGE in about contact privacy-policy terms-of-service disclaimer; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://dataengineerhub.blog/${PAGE}" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
              echo "✅ Essential page /${PAGE} is accessible (HTTP $STATUS)"
            else
              echo "⚠️ Essential page /${PAGE} returned status: $STATUS"
            fi
          done

          # Verify a sample article (-print -quit avoids SIGPIPE from head closing the pipe)
          SAMPLE_ARTICLE=$(find dist/articles -mindepth 2 -name 'index.html' -print -quit | sed 's|dist||; s|/index.html||')
          if [ -n "$SAMPLE_ARTICLE" ]; then
            SAMPLE_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://dataengineerhub.blog${SAMPLE_ARTICLE}" || echo "000")
            if [ "$SAMPLE_CODE" = "200" ]; then
              echo "✅ Sample article is accessible: ${SAMPLE_ARTICLE}"
            else
              echo "⚠️ Sample article check failed: ${SAMPLE_ARTICLE} (HTTP $SAMPLE_CODE)"
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "❌ Live deployment verification failed. Remaining checks above ran so the log shows every broken URL, not just the first one."
            exit 1
          fi
          echo "✅ Live deployment verification passed"
      - name: 📢 Notify Search Engines
        if: |
          always() &&
          steps.changes.outputs.skip_deploy != 'true' &&
          steps.changes.outputs.dry_run != 'true' &&
          steps.changes.outputs.notify_search_engines == 'true' &&
          (steps.ftp_deploy.outcome == 'success' || steps.ftp_deploy_retry.outcome == 'success') &&
          (steps.cache-restore.outputs.cache-hit != 'true' ||
           github.event_name == 'repository_dispatch' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        run: |
          npm run sitemap:notify || echo "⚠️ Search engine notification queued"
        continue-on-error: true
        timeout-minutes: 2

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Deployment status
          if [ "${{ steps.changes.outputs.dry_run }}" == "true" ]; then
            echo "### 🧪 Dry Run Mode" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build completed successfully (no actual deployment)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.skip_deploy }}" == "true" ]; then
            echo "### ⏭️ Build Only" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build completed successfully (deployment skipped by user)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show build type
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 WordPress Content Update" >> $GITHUB_STEP_SUMMARY
            echo "✅ Only changed pages were regenerated and deployed" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Incremental (Fast)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "nuclear-redeploy" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ☢️ Nuclear Redeploy" >> $GITHUB_STEP_SUMMARY
            echo "✅ Complete wipe and redeploy - all files uploaded fresh" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Nuclear (Complete Reset)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "force-rebuild" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔨 Force Rebuild" >> $GITHUB_STEP_SUMMARY
            echo "✅ All pages regenerated with unique timestamps and force uploaded" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Full (Forced)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "full-with-categories" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📚 Full Build" >> $GITHUB_STEP_SUMMARY
            echo "✅ All pages including categories and tags regenerated" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Complete" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ] && [ "${{ steps.changes.outputs.skip_cache }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚡ Cache Hit" >> $GITHUB_STEP_SUMMARY
            echo "✅ Using cached build with incremental updates" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Time Saved:** ~50-70 seconds" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🆕 Fresh Build" >> $GITHUB_STEP_SUMMARY
            echo "✅ Complete build from scratch" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Full" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 [Live Site](https://dataengineerhub.blog)" >> $GITHUB_STEP_SUMMARY
          echo "- 🗺️ [Sitemap](https://dataengineerhub.blog/sitemap.xml)" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 [Robots.txt](https://dataengineerhub.blog/robots.txt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.static_pages.outputs.article_count }}" != "" ]; then
            echo "- **Articles:** ${{ steps.static_pages.outputs.article_count }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.changes.outputs.verify_build }}" == "true" ]; then
            echo "- **Verification:** ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Save Cache
        if: |
          steps.changes.outputs.skip_cache != 'true' &&
          (steps.cache-restore.outputs.cache-hit != 'true' || steps.changes.outputs.code_changed == 'true' || github.event_name == 'repository_dispatch')
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.npm
            dist
            public/sitemap.xml
            public/indexnow-key.txt
            .build-cache.json
          key: build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'postcss.config.js') }}-${{ github.run_id }}

      - name: 💾 Save FTP Sync State
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-state-${{ github.run_id }}

      - name: 💾 Upload Artifact
        if: |
          steps.changes.outputs.skip_deploy == 'true' ||
          steps.cache-restore.outputs.cache-hit != 'true' || 
          github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.run_number }}
          path: |
            dist/
            public/sitemap.xml
            .build-cache.json
          retention-days: 7
        continue-on-error: true

  validate-sitemap:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🗺️ Generate Sitemap
        run: npm run sitemap:generate
      
      - name: ✅ Validate Sitemap
        run: npm run sitemap:validate
      
      - name: 💬 PR Comment
        uses: actions/github-script@v8
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '## 🗺️ Sitemap Validation\n\n';
            
            if (fs.existsSync('public/sitemap.xml')) {
              const content = fs.readFileSync('public/sitemap.xml', 'utf8');
              const urlCount = (content.match(/<url>/g) || []).length;
              
              body += `✅ Sitemap generated successfully!\n\n`;
              body += `📊 **Stats:**\n`;
              body += `- URLs: ${urlCount}\n`;
              body += `- Size: ${(content.length / 1024).toFixed(2)} KB\n`;
            } else {
              body += `⚠️ Sitemap not found. This may be expected if sitemap generation is optional.\n`;
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true
