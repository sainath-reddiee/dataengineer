name: Build and Deploy to Hostinger (Incremental)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'functions.php'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        default: 'incremental'
        options:
          - 'incremental'
          - 'force-rebuild'
          - 'full-with-categories'
          - 'posts-only'
          - 'nuclear-redeploy'
      skip_cache:
        description: 'Skip build cache?'
        required: false
        type: boolean
        default: false
      skip_deploy:
        description: 'Build only (skip deployment)?'
        required: false
        type: boolean
        default: false
      verify_build:
        description: 'Run build verification?'
        required: false
        type: boolean
        default: true
      notify_search_engines:
        description: 'Notify search engines?'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (test without actual deployment)?'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 21 * * *'
  repository_dispatch:
    types: [post-published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Detect Changes & Configure Build
        id: changes
        run: |
          echo "trigger=${{ github.event_name }}" >> $GITHUB_OUTPUT
          
          # Detect code changes
          if git diff --name-only HEAD^ HEAD | grep -qE '^(src/|scripts/|public/|index.html|vite.config.js|tailwind.config.js|package)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Code changes detected - full rebuild needed"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "📄 Only content/config changed"
          fi
          
          # Configure build based on trigger type and inputs
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            SKIP_CACHE="${{ github.event.inputs.skip_cache }}"
            SKIP_DEPLOY="${{ github.event.inputs.skip_deploy }}"
            VERIFY_BUILD="${{ github.event.inputs.verify_build }}"
            NOTIFY_SE="${{ github.event.inputs.notify_search_engines }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            
            echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
            echo "skip_cache=$SKIP_CACHE" >> $GITHUB_OUTPUT
            echo "skip_deploy=$SKIP_DEPLOY" >> $GITHUB_OUTPUT
            echo "verify_build=$VERIFY_BUILD" >> $GITHUB_OUTPUT
            echo "notify_search_engines=$NOTIFY_SE" >> $GITHUB_OUTPUT
            echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
            
            # Set dangerous clean slate flag for nuclear option
            if [ "$BUILD_TYPE" == "nuclear-redeploy" ]; then
              echo "use_clean_slate=true" >> $GITHUB_OUTPUT
              echo "☢️  NUCLEAR REDEPLOY MODE ENABLED"
            else
              echo "use_clean_slate=false" >> $GITHUB_OUTPUT
            fi
            
            echo "🎮 Manual trigger with options:"
            echo "  - Build Type: $BUILD_TYPE"
            echo "  - Skip Cache: $SKIP_CACHE"
            echo "  - Skip Deploy: $SKIP_DEPLOY"
            echo "  - Verify Build: $VERIFY_BUILD"
            echo "  - Notify Search Engines: $NOTIFY_SE"
            echo "  - Dry Run: $DRY_RUN"
          else
            # Default behavior for automated triggers
            echo "build_type=incremental" >> $GITHUB_OUTPUT
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
            echo "verify_build=true" >> $GITHUB_OUTPUT
            echo "notify_search_engines=true" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "use_clean_slate=false" >> $GITHUB_OUTPUT
          fi
          
          # Determine build flags
          case "${{ github.event.inputs.build_type }}" in
            "force-rebuild"|"nuclear-redeploy")
              echo "build_flags=--force" >> $GITHUB_OUTPUT
              echo "🔨 Force rebuild all pages"
              ;;
            "full-with-categories")
              echo "build_flags=--force" >> $GITHUB_OUTPUT
              echo "📚 Full rebuild including categories/tags"
              ;;
            "posts-only")
              echo "build_flags=--posts-only" >> $GITHUB_OUTPUT
              echo "📄 Posts only (no force)"
              ;;
            *)
              echo "build_flags=" >> $GITHUB_OUTPUT
              echo "📚 Full build (including categories/tags/articles listing)"
              ;;
          esac

      - name: 💾 Restore Build Cache
        id: cache-restore
        if: steps.changes.outputs.skip_cache != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            dist
            public/sitemap.xml
            public/indexnow-key.txt
            .build-cache.json
          key: build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'postcss.config.js') }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 💾 Restore FTP Sync State
        id: ftp-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-state-
          restore-keys: |
            ftp-state-

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🗺️ Generate & Validate Sitemap
        if: |
          steps.cache-restore.outputs.cache-hit != 'true' || 
          github.event_name == 'repository_dispatch' || 
          github.event_name == 'schedule' ||
          steps.changes.outputs.skip_cache == 'true'
        run: |
          npm run sitemap:generate || echo "⚠️ Sitemap generation skipped"
          npm run sitemap:validate || echo "⚠️ Sitemap validation skipped"
          npm run llm-sitemap || echo "⚠️ LLM sitemap generation skipped"
        continue-on-error: true

      - name: 🏗️ Build Application (Vite)
        if: steps.cache-restore.outputs.cache-hit != 'true' || steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.skip_cache == 'true'
        run: npm run build:vite
        env:
          NODE_ENV: production
          VITE_ADS_ENABLED: ${{ secrets.VITE_ADS_ENABLED }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_ADMIN_USER_HASH: ${{ secrets.VITE_ADMIN_USER_HASH }}
          VITE_ADMIN_PASS_HASH: ${{ secrets.VITE_ADMIN_PASS_HASH }}
          VITE_GISCUS_REPO: ${{ secrets.VITE_GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ secrets.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ secrets.VITE_GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.VITE_GISCUS_CATEGORY_ID }}
          VITE_BREVO_API_KEY: ${{ secrets.VITE_BREVO_API_KEY }}
          VITE_BREVO_LIST_ID: ${{ secrets.VITE_BREVO_LIST_ID }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_GSC_CLIENT_ID: ${{ secrets.VITE_GSC_CLIENT_ID }}

      - name: 🗑️ Delete Build Cache (Force Fresh Build)
        if: |
          steps.changes.outputs.build_type == 'force-rebuild' || 
          steps.changes.outputs.build_type == 'nuclear-redeploy'
        run: |
          rm -f .build-cache.json
          echo "🗑️ Build cache deleted - all pages will be regenerated with unique timestamps"
          echo "✅ This ensures FTP will detect file changes and upload them"

      - name: 📄 Generate Static Pages
        id: static_pages
        env:
          NODE_ENV: production
          VITE_ADS_ENABLED: ${{ secrets.VITE_ADS_ENABLED }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          # Get build flags from previous step
          BUILD_FLAGS="${{ steps.changes.outputs.build_flags }}"
          
          echo "🚀 Running build with flags: $BUILD_FLAGS"
          node scripts/generateStaticPagesIncremental.js $BUILD_FLAGS
          
          # ⚠️ CRITICAL: Verify articles exist before deploying
          echo ""
          echo "🔍 Verifying article pages in dist/..."
          
          if [ ! -d "dist/articles" ]; then
            echo "❌ ERROR: dist/articles directory not found!"
            echo "🔨 Forcing complete rebuild of all pages..."
            node scripts/generateStaticPagesIncremental.js --posts-only --force
          fi
          
          # Count article pages
          ARTICLE_COUNT=$(find dist/articles -name 'index.html' 2>/dev/null | wc -l || echo "0")
          echo "📊 Found $ARTICLE_COUNT article pages in dist/"
          
          if [ "$ARTICLE_COUNT" -eq 0 ]; then
            echo "❌ CRITICAL: No articles found in dist/articles!"
            echo "This would cause the FTP sync to delete all articles from the server."
            echo ""
            echo "Attempting one final forced rebuild..."
            node scripts/generateStaticPagesIncremental.js --posts-only --force
            
            # Re-check after force rebuild
            ARTICLE_COUNT=$(find dist/articles -name 'index.html' 2>/dev/null | wc -l || echo "0")
            
            if [ "$ARTICLE_COUNT" -eq 0 ]; then
              echo "❌ FATAL: Still no articles after forced rebuild!"
              echo "Deployment aborted to prevent data loss."
              exit 1
            fi
          fi
          
          echo "✅ Deployment ready with $ARTICLE_COUNT article pages"
          
          # Verify essential pages were generated
          ESSENTIAL_COUNT=0
          for PAGE in about contact privacy-policy terms-of-service disclaimer; do
            if [ -f "dist/${PAGE}/index.html" ]; then
              ESSENTIAL_COUNT=$((ESSENTIAL_COUNT + 1))
              echo "  ✅ dist/${PAGE}/index.html exists"
            else
              echo "  ⚠️ dist/${PAGE}/index.html MISSING"
            fi
          done
          echo "📊 Found $ESSENTIAL_COUNT/5 essential pages in dist/"
          
          # Generate FAQ schemas for articles
          echo ""
          echo "📋 Generating FAQ schemas..."
          npm run faq-schema || echo "⚠️ FAQ schema generation skipped"
          
          echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          echo "build_completed=true" >> $GITHUB_OUTPUT
          
          # Add to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Static Pages Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Articles:** $ARTICLE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ steps.changes.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Flags:** \`$BUILD_FLAGS\`" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$BUILD_FLAGS" == *"--posts-only"* ]]; then
            echo "- ℹ️  **Note:** Categories and tags are handled dynamically by React" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Verify Build (Optional)
        if: steps.changes.outputs.verify_build == 'true'
        run: |
          echo "🔍 Running build verification..."
          npm run build:verify || {
            echo "⚠️ Build verification found issues but continuing..."
            echo "Check the logs above for details"
          }
        continue-on-error: true

      - name: ℹ️ Build Status
        run: |
          echo "## 📊 Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Manual Options:**" >> $GITHUB_STEP_SUMMARY
            echo "- Build Type: ${{ steps.changes.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
            echo "- Skip Cache: ${{ steps.changes.outputs.skip_cache }}" >> $GITHUB_STEP_SUMMARY
            echo "- Skip Deploy: ${{ steps.changes.outputs.skip_deploy }}" >> $GITHUB_STEP_SUMMARY
            echo "- Verify Build: ${{ steps.changes.outputs.verify_build }}" >> $GITHUB_STEP_SUMMARY
            echo "- Dry Run: ${{ steps.changes.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ] && [ "${{ steps.changes.outputs.skip_cache }}" != "true" ]; then
            if [ "${{ steps.changes.outputs.code_changed }}" == "true" ]; then
              echo "🔨 Code changed - full rebuild performed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚡ Using cached build + incremental pages" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "🆕 Fresh build completed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show what triggered this build
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 WordPress Content Update" >> $GITHUB_STEP_SUMMARY
            echo "Triggered by: Post published/updated in WordPress" >> $GITHUB_STEP_SUMMARY
            echo "Only changed pages were regenerated!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔑 Generate IndexNow Key
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          
          const publicDir = path.join(process.cwd(), 'public');
          const keyFile = path.join(publicDir, 'indexnow-key.txt');
          
          if (!fs.existsSync(publicDir)) {
            fs.mkdirSync(publicDir, { recursive: true });
          }
          
          if (fs.existsSync(keyFile)) {
            const key = fs.readFileSync(keyFile, 'utf8').trim();
            console.log('✅ Using existing key:', key);
          } else {
            const key = crypto.randomBytes(16).toString('hex');
            fs.writeFileSync(keyFile, key, 'utf8');
            const verificationFile = path.join(publicDir, \`\${key}.txt\`);
            fs.writeFileSync(verificationFile, key, 'utf8');
            console.log('🔑 Generated new key:', key);
          }
          "

      - name: 📋 Prepare Files
        run: |
          mkdir -p dist
          
          [ -f "public/sitemap.xml" ] && cp public/sitemap.xml dist/ && echo "✅ Copied sitemap.xml"
          [ -f "public/sitemap-index.xml" ] && cp public/sitemap-index.xml dist/ && echo "✅ Copied sitemap-index.xml"
          [ -f "public/robots.txt" ] && cp public/robots.txt dist/ && echo "✅ Copied robots.txt"
          [ -f "public/.htaccess" ] && cp public/.htaccess dist/ && echo "✅ Copied .htaccess"
          
          find public -name "*.txt" -exec cp {} dist/ \; 2>/dev/null && echo "✅ Copied .txt files" || echo "⚠️ No .txt files found"
          
          # Clean up stale files that should no longer be deployed
          [ -f "dist/sitemap-pseo-1.xml" ] && rm dist/sitemap-pseo-1.xml && echo "🗑️ Removed stale sitemap-pseo-1.xml from dist"
          
          echo "✅ Files prepared for deployment"

      - name: 🗑️ Clear FTP Sync State (Force Upload All Files)
        if: |
          steps.changes.outputs.build_type == 'force-rebuild' || 
          steps.changes.outputs.build_type == 'nuclear-redeploy'
        run: |
          echo "🗑️ Removing FTP sync state to force re-upload of all files..."
          rm -f .ftp-deploy-sync-state.json
          echo "✅ FTP sync state cleared - ALL files will be uploaded"
          echo ""
          echo "This ensures that even if file timestamps are the same,"
          echo "the FTP tool will re-upload everything because it has no"
          echo "previous state to compare against."
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Force Upload Enabled" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ FTP sync state cleared - all files will be re-uploaded regardless of changes" >> $GITHUB_STEP_SUMMARY
          echo "📝 Each HTML file contains unique build timestamp to ensure file content differs" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Copy FTP Sync State to dist/
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        run: |
          if [ -f ".ftp-deploy-sync-state.json" ]; then
            cp .ftp-deploy-sync-state.json dist/
            echo "✅ FTP sync state copied to dist/"
          else
            echo "ℹ️ No FTP sync state found in root"
          fi

      - name: 🚀 Deploy to Hostinger (FTPS)
        if: steps.changes.outputs.skip_deploy != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: ${{ steps.changes.outputs.use_clean_slate == 'true' }}
          state-name: .ftp-deploy-sync-state.json
          dry-run: ${{ steps.changes.outputs.dry_run == 'true' }}
          timeout: 300000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.DS_Store
            **/Thumbs.db
            **/.build-cache.json
            **/*.map

      - name: 💾 Copy FTP Sync State to Root for Caching
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true' && always()
        run: |
          if [ -f "dist/.ftp-deploy-sync-state.json" ]; then
            cp dist/.ftp-deploy-sync-state.json .ftp-deploy-sync-state.json
            echo "✅ FTP sync state copied back to root for caching"
          else
            echo "⚠️ No FTP sync state found in dist/"
          fi

      - name: ⏭️ Deployment Skipped
        if: steps.changes.outputs.skip_deploy == 'true'
        run: |
          echo "⏭️ Deployment skipped by user request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully but was not deployed." >> $GITHUB_STEP_SUMMARY

      - name: ⏸️ Smart Wait
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "⚡ WordPress update - quick wait (5s)"
            sleep 5
          elif [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "⚡ Cache hit - minimal wait (3s)"
            sleep 3
          else
            echo "⏳ Full deploy - waiting 8s for propagation"
            sleep 8
          fi

      - name: 🔍 Deployment Verification
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        run: |
          echo "🔍 Verifying deployment..."
          
          if curl -sf -o /dev/null -w "%{http_code}" https://dataengineerhub.blog/ | grep -q "200"; then
            echo "✅ Main site is accessible"
          else
            echo "⚠️ Main site check failed"
          fi
          
          if curl -sf -o /dev/null https://dataengineerhub.blog/sitemap.xml; then
            echo "✅ Sitemap is accessible"
          else
            echo "⚠️ Sitemap not found"
          fi
          
          if curl -sf -o /dev/null https://dataengineerhub.blog/robots.txt; then
            echo "✅ Robots.txt is accessible"
          else
            echo "⚠️ Robots.txt not found"
          fi
          
          if [ -f "public/indexnow-key.txt" ]; then
            KEY=$(cat public/indexnow-key.txt | tr -d '[:space:]')
            if curl -sf -o /dev/null "https://dataengineerhub.blog/${KEY}.txt"; then
              echo "✅ IndexNow key verification file is accessible"
            else
              echo "⚠️ IndexNow key verification failed"
            fi
          fi
          
          # Verify essential pages (About, Contact, Privacy, Terms, Disclaimer)
          for PAGE in about contact privacy-policy terms-of-service disclaimer; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://dataengineerhub.blog/${PAGE}" || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ Essential page /${PAGE} is accessible"
            else
              echo "⚠️ Essential page /${PAGE} returned status: $STATUS"
            fi
          done
          
          # Verify a sample article
          SAMPLE_ARTICLE=$(find dist/articles -name 'index.html' | head -1 | sed 's|dist||' | sed 's|/index.html||')
          if [ ! -z "$SAMPLE_ARTICLE" ]; then
            if curl -sf -o /dev/null "https://dataengineerhub.blog${SAMPLE_ARTICLE}"; then
              echo "✅ Sample article is accessible: ${SAMPLE_ARTICLE}"
            else
              echo "⚠️ Sample article check failed: ${SAMPLE_ARTICLE}"
            fi
          fi
        continue-on-error: true

      - name: 📢 Notify Search Engines
        if: |
          steps.changes.outputs.skip_deploy != 'true' && 
          steps.changes.outputs.dry_run != 'true' &&
          steps.changes.outputs.notify_search_engines == 'true' &&
          (steps.cache-restore.outputs.cache-hit != 'true' || 
           github.event_name == 'repository_dispatch' || 
           github.event_name == 'schedule')
        run: |
          npm run sitemap:notify || echo "⚠️ Search engine notification queued"
        continue-on-error: true
        timeout-minutes: 2

      - name: 💾 Restore Newsletter Dedup State
        # Restores a tiny cache file that records the last post ID we sent an email for.
        # Prevents duplicate sends when WordPress triggers multiple rapid deploys
        # (e.g. autosave -> publish -> minor update all within minutes of each other).
        id: newsletter-dedup
        uses: actions/cache/restore@v4
        with:
          path: /tmp/newsletter_sent_ids.txt
          key: newsletter-sent-${{ github.run_id }}
          restore-keys: |
            newsletter-sent-
        continue-on-error: true

      - name: 📧 Send Newsletter Email (New Posts)
        # Only fires on real deploys triggered by a new post (repository_dispatch) or
        # a manual workflow_dispatch - never on scheduled rebuilds or cache-only hits.
        if: |
          steps.changes.outputs.skip_deploy != 'true' &&
          steps.changes.outputs.dry_run != 'true' &&
          secrets.VITE_BREVO_API_KEY != '' &&
          (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        env:
          BREVO_API_KEY: ${{ secrets.VITE_BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.VITE_BREVO_LIST_ID || '2' }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || 'sainath@dataengineerhub.blog' }}
          BREVO_SENDER_NAME: DataEngineer Hub
          WP_API_URL: https://app.dataengineerhub.blog/wp-json/wp/v2
        run: |
          echo "📧 Fetching latest post from WordPress..."

          # _embed=wp:featuredmedia fetches the actual post image.
          # _fields restricts to only what we need (fast + no private data).
          # date_gmt is UTC, used for timezone-safe freshness calculation.
          curl -s --max-time 15 \
            "${WP_API_URL}/posts?per_page=1&orderby=date&order=desc&status=publish&_embed=wp:featuredmedia&_fields=id,title,slug,excerpt,date,date_gmt,_embedded" \
            -H "Accept: application/json" > /tmp/wp_posts.json

          if [ ! -s /tmp/wp_posts.json ] || [ "$(cat /tmp/wp_posts.json)" = "[]" ]; then
            echo "⚠️ No posts returned from WordPress API - skipping newsletter."
            exit 0
          fi

          # ── Single parse pass: extracts all fields including featured image ──
          # Writing to files avoids all shell-quoting issues with JSON content.
          node -e "
            const fs = require('fs');
            try {
              const posts = JSON.parse(fs.readFileSync('/tmp/wp_posts.json','utf8'));
              const p = Array.isArray(posts) ? posts[0] : posts;
              if (!p || !p.id) { fs.writeFileSync('/tmp/post_data.json','SKIP'); process.exit(0); }

              // Featured image: prefer large size, fall back through sizes, then source_url
              const embedded = p._embedded || {};
              const mediaArr = embedded['wp:featuredmedia'];
              let featuredImage = '';
              if (Array.isArray(mediaArr) && mediaArr.length > 0) {
                const m = mediaArr[0];
                featuredImage =
                  (m.media_details && m.media_details.sizes &&
                    (m.media_details.sizes.large || m.media_details.sizes.medium_large) &&
                    ((m.media_details.sizes.large || m.media_details.sizes.medium_large).source_url)) ||
                  m.source_url || '';
              }

              // HTML-escape helper for safe interpolation into email HTML
              const esc = s => (s||'')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

              // Decode WP HTML entities in title (for display, not HTML injection)
              const clean = s => (s||'')
                .replace(/&amp;/g,'&')
                .replace(/&#8211;|&#x2013;/g,'–')
                .replace(/&#8212;|&#x2014;/g,'—')
                .replace(/&#8217;|&#x2019;/g,"'")
                .replace(/&#8216;|&#x2018;/g,"'")
                .replace(/&#8220;|&#x201C;/g,'"')
                .replace(/&#8221;|&#x201D;/g,'"')
                .replace(/&#038;/g,'&');

              const title   = clean(p.title && p.title.rendered ? p.title.rendered : p.title || '');
              const excerpt = (p.excerpt && p.excerpt.rendered ? p.excerpt.rendered : '')
                .replace(/<[^>]+>/g,'')
                .replace(/\[&hellip;\]/g,'...')
                .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ')
                .trim().slice(0,280);
              const slug    = p.slug || '';
              const date    = p.date
                ? new Date(p.date).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})
                : '';
              const url     = 'https://dataengineerhub.blog/articles/' + slug;
              const postId  = String(p.id);
              // date_gmt is UTC — used for timezone-safe freshness check.
              // Append 'Z' so JavaScript / GNU date parses it as UTC unambiguously.
              const dateGmt = (p.date_gmt || p.date || '').replace(/Z?$/,'Z');

              fs.writeFileSync('/tmp/post_data.json', JSON.stringify({
                title, excerpt, url, date, postId, dateGmt, featuredImage,
                titleHtml: esc(title), excerptHtml: esc(excerpt)
              }));
            } catch(e) {
              fs.writeFileSync('/tmp/post_data.json','SKIP');
            }
          "

          if [ "$(cat /tmp/post_data.json)" = "SKIP" ] || [ ! -s /tmp/post_data.json ]; then
            echo "⚠️ Could not parse latest post - skipping newsletter."
            exit 0
          fi

          POST_ID=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/post_data.json','utf8')).postId||'')")
          DATE_GMT=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/post_data.json','utf8')).dateGmt||'')")

          # ── Deduplication layer 1: Freshness gate (timezone-safe) ─────────
          # Uses date_gmt (UTC) + the 'Z' suffix so GNU date always parses as UTC.
          # Skips posts older than 4 hours to avoid re-emailing on re-deploys.
          if [ -n "$DATE_GMT" ]; then
            PUBLISH_TS=$(date -d "$DATE_GMT" +%s 2>/dev/null || echo "0")
            CURRENT_TS=$(date +%s)
            AGE_HOURS=$(( (CURRENT_TS - PUBLISH_TS) / 3600 ))
            echo "⏱️  Post published $AGE_HOURS hour(s) ago (ID: $POST_ID)"
            if [ "$AGE_HOURS" -gt 4 ]; then
              echo "⏭️  Post is $AGE_HOURS hours old - skipping (not a fresh publish)."
              exit 0
            fi
          fi

          # ── Deduplication layer 2: ID-based cache check ──────────────────
          if [ -n "$POST_ID" ] && [ -f /tmp/newsletter_sent_ids.txt ]; then
            if grep -qF "$POST_ID" /tmp/newsletter_sent_ids.txt 2>/dev/null; then
              echo "⏭️  Post ID $POST_ID already in dedup cache - skipping duplicate send."
              exit 0
            fi
          fi

          # ── Build rich HTML email ─────────────────────────────────────────
          # Reads from /tmp/post_data.json which already has HTML-escaped fields.
          node -e "
            const fs = require('fs');
            const d  = JSON.parse(fs.readFileSync('/tmp/post_data.json','utf8'));

            const subject  = 'New on DataEngineer Hub: ' + d.title;
            // Use the actual post's featured image; fall back to the site OG image
            const imgSrc   = d.featuredImage || 'https://dataengineerhub.blog/og-image.jpg';
            // titleHtml and excerptHtml are already HTML-escaped in the parse step
            const titleHtml  = d.titleHtml  || d.title;
            const excerptHtml = d.excerptHtml || d.excerpt;

            const html = [
              '<!DOCTYPE html>',
              '<html lang="en">',
              '<head>',
              '<meta charset="UTF-8">',
              '<meta name="viewport" content="width=device-width,initial-scale=1.0">',
              '<title>' + titleHtml + '</title>',
              '</head>',
              '<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;">',
              '<div style="max-width:600px;margin:0 auto;background-color:#ffffff;">',

              '<!-- Header -->',
              '<table width="100%" cellpadding="0" cellspacing="0" style="background:#1e293b;">',
              '<tr><td style="padding:18px 32px;text-align:center;">',
              '<a href="https://dataengineerhub.blog" style="color:#60a5fa;font-size:13px;font-weight:700;letter-spacing:0.1em;text-decoration:none;">',
              'DATAENGINEER HUB</a>',
              '</td></tr></table>',

              '<!-- Featured Image -->',
              '<img src="' + imgSrc + '" alt="' + titleHtml + '" width="600"',
              ' style="width:100%;max-height:320px;height:auto;display:block;object-fit:cover;" />',

              '<!-- Content -->',
              '<div style="padding:32px 32px 24px;">',
              '<p style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 10px;">',
              'New Article &bull; ' + d.date + '</p>',
              '<h1 style="font-size:22px;font-weight:700;color:#0f172a;line-height:1.3;margin:0 0 14px;">',
              titleHtml + '</h1>',
              '<p style="font-size:15px;line-height:1.7;color:#475569;margin:0 0 28px;">',
              excerptHtml + '</p>',
              '<a href="' + d.url + '"',
              ' style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;',
              'font-weight:600;text-decoration:none;padding:14px 28px;border-radius:8px;">',
              'Read Full Article &#8594;</a>',
              '</div>',

              '<!-- Footer -->',
              '<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;border-top:1px solid #e2e8f0;">',
              '<tr><td style="padding:20px 32px;">',
              '<p style="font-size:12px;color:#94a3b8;margin:0 0 6px;">',
              'You received this because you subscribed to DataEngineer Hub updates.</p>',
              '<p style="font-size:12px;color:#94a3b8;margin:0;">',
              '<a href="https://dataengineerhub.blog" style="color:#64748b;text-decoration:none;">Visit site</a>',
              ' &nbsp;&bull;&nbsp; ',
              '<a href="https://dataengineerhub.blog/newsletter" style="color:#64748b;text-decoration:none;">Manage subscription</a>',
              '</p></td></tr></table>',

              '</div></body></html>'
            ].join('\n');

            fs.writeFileSync('/tmp/email_subject.txt', subject);
            fs.writeFileSync('/tmp/email_body.html', html);
          "

          SUBJECT=$(cat /tmp/email_subject.txt)
          echo "📨 Creating Brevo campaign: \"$SUBJECT\""

          # ── Build Brevo campaign JSON payload (written to file for safe curl) ─
          node -e "
            const fs      = require('fs');
            const subject = fs.readFileSync('/tmp/email_subject.txt','utf8').trim();
            const html    = fs.readFileSync('/tmp/email_body.html','utf8');
            const listId  = parseInt(process.env.BREVO_LIST_ID || '2', 10);
            const payload = {
              name        : 'Auto: ' + subject.slice(0,60),
              subject     : subject,
              sender      : { email: process.env.BREVO_SENDER_EMAIL, name: process.env.BREVO_SENDER_NAME },
              type        : 'classic',
              htmlContent : html,
              recipients  : { listIds: [isNaN(listId) ? 2 : listId] }
            };
            fs.writeFileSync('/tmp/brevo_payload.json', JSON.stringify(payload));
          "

          # curl reads JSON from disk (-d @file) - no shell-quoting issues with HTML content
          CAMPAIGN_RESP=$(curl -s -o /tmp/brevo_campaign.json -w "%{http_code}" \
            -X POST "https://api.brevo.com/v3/emailCampaigns" \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/brevo_payload.json)

          if [ "$CAMPAIGN_RESP" != "201" ]; then
            echo "⚠️ Brevo campaign creation returned HTTP $CAMPAIGN_RESP:"
            cat /tmp/brevo_campaign.json 2>/dev/null || true
            echo "ℹ️ Newsletter skipped. Deployment is complete."
            exit 0
          fi

          CAMPAIGN_ID=$(node -e "
            const d = JSON.parse(require('fs').readFileSync('/tmp/brevo_campaign.json','utf8'));
            process.stdout.write(String(d.id||''));
          ")

          if [ -z "$CAMPAIGN_ID" ]; then
            echo "⚠️ Could not read campaign ID - skipping send."
            exit 0
          fi

          SEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.brevo.com/v3/emailCampaigns/${CAMPAIGN_ID}/sendNow" \
            -H "api-key: ${BREVO_API_KEY}")

          if [ "$SEND_CODE" = "204" ] || [ "$SEND_CODE" = "200" ]; then
            echo "✅ Newsletter sent (campaign ID: $CAMPAIGN_ID, HTTP $SEND_CODE)"
            if [ -n "$POST_ID" ]; then
              echo "$POST_ID" >> /tmp/newsletter_sent_ids.txt
              echo "✏️  Marked post ID $POST_ID as sent in dedup cache."
            fi
          else
            echo "⚠️ Brevo sendNow returned HTTP $SEND_CODE for campaign $CAMPAIGN_ID"
            echo "ℹ️ Check the Brevo dashboard for campaign status."
          fi
        continue-on-error: true
        timeout-minutes: 3

      - name: 💾 Save Newsletter Dedup State
        # Persists the dedup ID file so the next workflow run can check it.
        # Uses a unique key per run + a shared prefix so restore-keys always
        # finds the most recently saved state.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/newsletter_sent_ids.txt
          key: newsletter-sent-${{ github.run_id }}
        continue-on-error: true

      - name: 📊 Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Deployment status
          if [ "${{ steps.changes.outputs.dry_run }}" == "true" ]; then
            echo "### 🧪 Dry Run Mode" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build completed successfully (no actual deployment)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.skip_deploy }}" == "true" ]; then
            echo "### ⏭️ Build Only" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build completed successfully (deployment skipped by user)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show build type
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 WordPress Content Update" >> $GITHUB_STEP_SUMMARY
            echo "✅ Only changed pages were regenerated and deployed" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Incremental (Fast)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "nuclear-redeploy" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ☢️ Nuclear Redeploy" >> $GITHUB_STEP_SUMMARY
            echo "✅ Complete wipe and redeploy - all files uploaded fresh" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Nuclear (Complete Reset)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "force-rebuild" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔨 Force Rebuild" >> $GITHUB_STEP_SUMMARY
            echo "✅ All pages regenerated with unique timestamps and force uploaded" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Full (Forced)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.build_type }}" == "full-with-categories" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📚 Full Build" >> $GITHUB_STEP_SUMMARY
            echo "✅ All pages including categories and tags regenerated" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Complete" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ] && [ "${{ steps.changes.outputs.skip_cache }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚡ Cache Hit" >> $GITHUB_STEP_SUMMARY
            echo "✅ Using cached build with incremental updates" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Time Saved:** ~50-70 seconds" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🆕 Fresh Build" >> $GITHUB_STEP_SUMMARY
            echo "✅ Complete build from scratch" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Build Type:** Full" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 [Live Site](https://dataengineerhub.blog)" >> $GITHUB_STEP_SUMMARY
          echo "- 🗺️ [Sitemap](https://dataengineerhub.blog/sitemap.xml)" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 [Robots.txt](https://dataengineerhub.blog/robots.txt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.static_pages.outputs.article_count }}" != "" ]; then
            echo "- **Articles:** ${{ steps.static_pages.outputs.article_count }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.changes.outputs.verify_build }}" == "true" ]; then
            echo "- **Verification:** ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Save Cache
        if: |
          steps.changes.outputs.skip_cache != 'true' &&
          (steps.cache-restore.outputs.cache-hit != 'true' || steps.changes.outputs.code_changed == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            dist
            public/sitemap.xml
            public/indexnow-key.txt
            .build-cache.json
          key: build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'postcss.config.js') }}

      - name: 💾 Save FTP Sync State
        if: steps.changes.outputs.skip_deploy != 'true' && steps.changes.outputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-state-${{ github.run_id }}

      - name: 💾 Upload Artifact
        if: |
          steps.changes.outputs.skip_deploy == 'true' ||
          steps.cache-restore.outputs.cache-hit != 'true' || 
          github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          path: |
            dist/
            public/sitemap.xml
            .build-cache.json
          retention-days: 7
        continue-on-error: true

  validate-sitemap:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🗺️ Generate Sitemap
        run: npm run sitemap:generate
        continue-on-error: true
      
      - name: ✅ Validate Sitemap
        run: npm run sitemap:validate
        continue-on-error: true
      
      - name: 💬 PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '## 🗺️ Sitemap Validation\n\n';
            
            if (fs.existsSync('public/sitemap.xml')) {
              const content = fs.readFileSync('public/sitemap.xml', 'utf8');
              const urlCount = (content.match(/<url>/g) || []).length;
              
              body += `✅ Sitemap generated successfully!\n\n`;
              body += `📊 **Stats:**\n`;
              body += `- URLs: ${urlCount}\n`;
              body += `- Size: ${(content.length / 1024).toFixed(2)} KB\n`;
            } else {
              body += `⚠️ Sitemap not found. This may be expected if sitemap generation is optional.\n`;
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true
